plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 读取本地签名配置（keystore.properties，已被 git 忽略）
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.wisight.adauto'
    compileSdk 34

    defaultConfig {
        applicationId "com.wisight.adauto"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile rootProject.file(keystoreProperties['storeFile'] ?: "keystore/adauto.keystore")
            storePassword keystoreProperties['storePassword'] ?: "AdAuto2026"
            keyAlias keystoreProperties['keyAlias'] ?: "adauto"
            keyPassword keystoreProperties['keyPassword'] ?: "AdAuto2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
    lint {
        // 避免 release 构建时触发 lintVital 联网下载检查（发布前可在本地单独执行 lint）
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
}
