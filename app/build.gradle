plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 璇诲彇鏈湴绛惧悕閰嶇疆锛坘eystore.properties锛屽凡琚?git 蹇界暐锛?
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.wisight.adauto'
    compileSdk 34

    defaultConfig {
        applicationId "com.wisight.adauto"
        minSdk 26
        targetSdk 34
        versionCode 10208
        versionName "1.2.8"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile rootProject.file(keystoreProperties['storeFile'] ?: "keystore/adauto.keystore")
            storePassword keystoreProperties['storePassword'] ?: "AdAuto2026"
            keyAlias keystoreProperties['keyAlias'] ?: "adauto"
            keyPassword keystoreProperties['keyPassword'] ?: "AdAuto2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
    lint {
        // 閬垮厤 release 鏋勫缓鏃惰Е鍙?lintVital 鑱旂綉涓嬭浇妫€鏌ワ紙鍙戝竷鍓嶅彲鍦ㄦ湰鍦板崟鐙墽琛?lint锛?
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
}
